name: update-data

on:
  schedule:
    # dimanche 04:12 UTC, heure creuse, bye
    - cron: "12 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OpenRouter snapshot
        run: python3 scripts/fetch_pricing.py

      - name: Rebuild dataset
        run: python3 scripts/build_dataset.py

      - name: Commit si diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "aucun changement de prix, rien a committer"
          else
            git commit -m "chore(data): refresh OpenRouter pricing snapshot"
            git push
          fi
