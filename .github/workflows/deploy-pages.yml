name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # L'API Pages connait des echecs transitoires (~1 run sur 2 observes) :
      # les deux tentatives ci-dessous isolent ce bruit sans masquer un vrai problem.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deployment once on transient Pages API failure
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
